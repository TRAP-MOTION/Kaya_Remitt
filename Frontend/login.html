<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Kaya Remit</title>
  <link rel="icon" type="image/jpeg" href="assets/logo.jpeg" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    
    body { 
      background-color: #f4f6f8; 
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    
    /* Main Card Layout: Switches to 2 columns on desktop */
    .login-card {
      width: 100%;
      max-width: 440px; /* Mobile width */
      background: #ffffff;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      display: flex;
      flex-direction: column;
      transition: all 0.3s ease;
    }

    /* Top/Form Content Area */
    .content { padding: 36px 24px 28px; }
    
    .logo-wrapper { text-align: center; margin-bottom: 20px; }
    .logo { 
      width: 150px; 
      height: auto;
      mix-blend-multiply: multiply;
      display: inline-block;
    }

    .header-text { text-align: center; margin-bottom: 28px; }
    .header-text h1 { font-size: 24px; font-weight: 800; color: #111827; margin-bottom: 4px; }
    .header-text p { color: #6b7280; font-size: 14px; }

    /* Input Fields */
    .input-group {
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      margin-bottom: 14px;
      transition: border-color 0.2s, background 0.2s;
    }

    .input-group:focus-within {
      border-color: #00C853;
      background: #ffffff;
    }

    .input-group svg { width: 18px; height: 18px; margin-right: 10px; fill: #9ca3af; flex-shrink: 0; }
    .input-group input {
      border: none;
      background: transparent;
      outline: none;
      font-size: 14px;
      width: 100%;
      color: #1f2937;
    }

    .signin-btn {
      width: 100%;
      background: #00C853;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 50px;
      font-size: 15px;
      font-weight: 700;
      margin: 10px 0 16px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: background 0.2s;
    }
    .signin-btn:hover { background: #00b048; }

    .forgot { 
      text-align: center; 
      color: #4b5563; 
      font-size: 13px; 
      font-weight: 500;
      cursor: pointer; 
      transition: color 0.2s;
    }
    .forgot:hover { color: #00C853; }

    /* Green Bottom / Side Banner */
    .bottom {
      background: #00C853;
      padding: 36px 24px;
      border-top-left-radius: 32px;
      border-top-right-radius: 32px;
      text-align: center;
      color: white;
      margin-top: auto;
    }

    .bottom h2 { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
    .bottom p { font-size: 13px; opacity: 0.9; line-height: 1.5; margin-bottom: 18px; }

    .signup-btn {
      background: white;
      color: #00C853;
      border: none;
      padding: 10px 36px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    .signup-btn:hover { background: #f0fdf4; }

    /* TABLET & DESKTOP MEDIA QUERIES */
    @media (min-width: 768px) {
      body { padding: 40px 20px; }
      
      .login-card {
        max-width: 820px; /* Expands to desktop layout */
        flex-direction: row;
        min-height: 500px;
      }

      .content {
        width: 58%;
        padding: 40px 36px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .bottom {
        width: 42%;
        border-radius: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 40px 32px;
        margin-top: 0;
      }
    }
  </style>
</head>
<body>

  <div class="login-card">
    <!-- Form Content Side -->
    <div class="content">
      <div class="logo-wrapper">
        <img src="assets/logo.jpeg" alt="KayaRemit" class="logo">
      </div>

      <div class="header-text">
        <h1>Sign in</h1>
        <p>to continue with KayaRemit</p>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="input-group">
          <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
          <input type="email" id="loginEmail" placeholder="Email Address" required>
        </div>

        <div class="input-group">
          <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6z"/></svg>
          <input type="password" id="loginPassword" placeholder="Password" required>
        </div>

        <p id="loginError" style="display:none;color:#b91c1c;font-size:13px;margin:0 0 12px;text-align:left;"></p>

        <button type="submit" class="signin-btn" id="loginSubmitBtn">SIGN IN</button>
      </form>

      <p class="forgot">Forgot your password?</p>
    </div>

    <!-- Green Side Banner -->
    <div class="bottom">
      <h2>Hello, Friend!</h2>
      <p>Enter your personal details and start your financial journey with us.</p>
      <button class="signup-btn" onclick="window.location.href='register.html'">Register</button>
    </div>
  </div>

  <script src="services/api.js"></script>
  <script>
    if (Session.isAuthenticated()) {
      const user = Session.getUser();
      window.location.href = Session.dashboardForRole(user?.role);
    }

    async function handleLogin(e) {
      e.preventDefault();
      const errorEl = document.getElementById("loginError");
      const submitBtn = document.getElementById("loginSubmitBtn");
      errorEl.style.display = "none";
      errorEl.textContent = "";
      submitBtn.disabled = true;
      submitBtn.textContent = "SIGNING IN…";

      try {
        const { user } = await AuthAPI.loginAndStore({
          email: document.getElementById("loginEmail").value.trim(),
          password: document.getElementById("loginPassword").value,
        });
        window.location.href = Session.dashboardForRole(user.role);
      } catch (err) {
        errorEl.textContent = err.message || "Login failed.";
        errorEl.style.display = "block";
        submitBtn.disabled = false;
        submitBtn.textContent = "SIGN IN";
      }
    }
  </script>
</body>
</html>
