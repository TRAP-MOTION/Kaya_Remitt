<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Kaya Remit</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background: #FFFFFF; display: flex; flex-direction: column; min-height: 100vh; }
    
    .container {
      max-width: 420px; /* caps width on desktop */
      width: 100%;
      margin: 0 auto;
      padding: 0 24px;
    }

    .top { padding: 40px 0 20px; text-align: center; }
    .logo { width: 140px; margin-bottom: 30px; }
    .top h1 { font-size: 28px; font-weight: 800; margin-bottom: 8px; }
    .top p { color: #666; font-size: 14px; margin-bottom: 30px; }
    
    .input-group {
      background: #E0E0E0;
      border-radius: 12px;
      padding: 12px 14px; /* smaller padding */
      display: flex;
      align-items: center;
      margin-bottom: 14px;
    }
    .input-group svg { width: 18px; height: 18px; margin-right: 10px; fill: #666; flex-shrink: 0; }
    .input-group input {
      border: none;
      background: transparent;
      outline: none;
      font-size: 15px; /* smaller font */
      width: 100%;
      color: #333;
    }
    .input-group input::placeholder {
      color: #888;
      font-size: 15px;
    }

    .signin-btn {
      width: 100%;
      background: #00C853;
      color: white;
      border: none;
      padding: 14px; /* smaller padding */
      border-radius: 50px;
      font-size: 15px;
      font-weight: 700;
      margin: 10px 0 20px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .forgot { text-align: center; color: #333; font-size: 14px; margin-bottom: 30px; cursor: pointer; }

    .bottom {
      background: #00C853;
      padding: 40px 24px;
      border-top-left-radius: 40px;
      border-top-right-radius: 40px;
      text-align: center;
      color: white;
      margin-top: auto;
    }
    .bottom h2 { font-size: 24px; margin-bottom: 12px; }
    .bottom p { font-size: 14px; opacity: 0.9; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="container">
    <div class="top">
      <img src="assets/logo.jpeg" alt="KayaRemit" class="logo">
      <h1>Sign in</h1>
      <p>to continue with KayaRemit</p>

      <form>
        <div class="input-group">
          <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
          <input type="email" placeholder="Email" required>
        </div>
        <div class="input-group">
          <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6z"/></svg>
          <input type="password" placeholder="Password" required>
        </div>
        <button type="submit" class="signin-btn">SIGN IN</button>
      </form>

      <p class="forgot">Forgot your password?</p>
    </div>
  </div>

  <div class="bottom">
    <h2>Hello, Friend!</h2>
    <p>Enter your personal details and start your financial journey with us.</p>
  </div>
</body>
</html>
