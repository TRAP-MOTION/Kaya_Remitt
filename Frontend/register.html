<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Kaya Remit</title>
  <link rel="icon" type="image/jpeg" href="assets/logo.jpeg" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    
    body { 
      background-color: #f4f6f8; 
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    
    /* Main Card Layout: Switches to 2 columns on desktop */
    .register-card {
      width: 100%;
      max-width: 440px; /* Mobile width */
      background: #ffffff;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      transition: all 0.3s ease;
    }

    /* Green Banner Header */
    .header {
      background: #00C853;
      padding: 36px 24px 44px;
      border-bottom-left-radius: 32px;
      border-bottom-right-radius: 32px;
      text-align: center;
      color: white;
    }

    .logo { 
      width: 150px; 
      height: auto;
      margin-bottom: 12px; 
      mix-blend-multiply: multiply;
    }

    .header h1 { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
    .header p { opacity: 0.9; font-size: 13px; margin-bottom: 18px; }

    .login-btn {
      background: white;
      color: #00C853;
      border: none;
      padding: 10px 36px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    .login-btn:hover { background: #f0fdf4; }

    /* Form Content Area */
    .content { padding: 28px 24px; }
    .content h2 { font-size: 20px; font-weight: 800; margin-bottom: 16px; color: #111827; }

    /* Role Selector */
    .role-label {
      font-size: 11px;
      font-weight: 700;
      color: #6b7280;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: block;
    }

    .role-selector {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }

    .role-btn {
      flex: 1;
      padding: 10px 6px;
      border: 2px solid #e5e7eb;
      background: #f9fafb;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      color: #4b5563;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }

    .role-btn.active {
      border-color: #00C853;
      background: #e8f5e9;
      color: #00c853;
    }

    /* Input Fields */
    .input-group {
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      margin-bottom: 12px;
      transition: border-color 0.2s, background 0.2s;
    }

    .input-group:focus-within {
      border-color: #00C853;
      background: #ffffff;
    }

    .input-group svg { width: 18px; height: 18px; margin-right: 10px; fill: #9ca3af; flex-shrink: 0; }
    .input-group input {
      border: none;
      background: transparent;
      outline: none;
      font-size: 14px;
      width: 100%;
      color: #1f2937;
    }

    .register-btn {
      width: 100%;
      background: #00C853;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 50px;
      font-size: 15px;
      font-weight: 700;
      margin-top: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .register-btn:hover { background: #00b048; }

    /* TABLET & DESKTOP MEDIA QUERIES */
    @media (min-width: 768px) {
      body { padding: 40px 20px; }
      
      .register-card {
        max-width: 820px; /* Expands to desktop size */
        display: flex;
        flex-direction: row;
        min-height: 520px;
      }

      .header {
        width: 42%;
        border-radius: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 40px 32px;
      }

      .content {
        width: 58%;
        padding: 40px 36px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <div class="register-card">
    <!-- Green Side / Header -->
    <div class="header">
      <img src="assets/logo2.jpeg" alt="KayaRemit" class="logo">
      <h1>Welcome Back!</h1>
      <p>To keep connected with KayaRemit, please log in with your personal info.</p>
      <button class="login-btn" onclick="window.location.href='login.html'">Login</button>
    </div>

    <!-- Form Content -->
    <div class="content">
      <h2>Create Account</h2>

      <span class="role-label">Registering as:</span>
      <div class="role-selector">
        <button type="button" class="role-btn active" id="btnUser" onclick="setRole('user')"> Sender</button>
        <button type="button" class="role-btn" id="btnMerchant" onclick="setRole('merchant')"> Merchant</button>
      </div>

      <form id="registerForm" onsubmit="handleRegister(event)">
        <input type="hidden" id="selectedRole" value="user">

        <div class="input-group">
          <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          <input type="text" placeholder="Full Name" required>
        </div>

        <div class="input-group">
          <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
          <input type="email" placeholder="Email Address" required>
        </div>

        <div class="input-group">
          <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6z"/></svg>
          <input type="password" placeholder="Password" required>
        </div>

        <!-- Dynamic Field for Merchant Store Name -->
        <div class="input-group" id="merchantField" style="display: none;">
          <svg viewBox="0 0 24 24"><path d="M20 4H4v2h16V4zm1 10v-2l-1-5H4l-1 5v2h1v6h10v-6h4v6h2v-6h1zm-9 4H6v-4h6v4z"/></svg>
          <input type="text" id="businessNameInput" placeholder="Business / Store Name">
        </div>

        <button type="submit" class="register-btn">Register Account</button>
      </form>
    </div>
  </div>

  <script>
    function setRole(role) {
      document.getElementById('selectedRole').value = role;
      
      document.getElementById('btnUser').classList.remove('active');
      document.getElementById('btnMerchant').classList.remove('active');
      document.getElementById('btnAdmin').classList.remove('active');

      if (role === 'user') document.getElementById('btnUser').classList.add('active');
      if (role === 'merchant') document.getElementById('btnMerchant').classList.add('active');
      if (role === 'admin') document.getElementById('btnAdmin').classList.add('active');

      const merchantField = document.getElementById('merchantField');
      if (role === 'merchant') {
        merchantField.style.display = 'flex';
        document.getElementById('businessNameInput').setAttribute('required', 'true');
      } else {
        merchantField.style.display = 'none';
        document.getElementById('businessNameInput').removeAttribute('required');
      }
    }

    function handleRegister(e) {
      e.preventDefault();
      const role = document.getElementById('selectedRole').value;

      if (role === 'merchant') {
        window.location.href = 'merchant-dashboard.html';
      } else if (role === 'admin') {
        window.location.href = 'admin-dashboard.html';
      } else {
        window.location.href = 'dashboard.html';
      }
    }
  </script>
</body>
</html>
