<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Kaya Remit</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background: #F5F5F5; }
    
    .container {
      max-width: 420px; /* caps width on desktop */
      width: 100%;
      margin: 0 auto;
    }
    
    .header {
      background: #00C853;
      padding: 40px 24px 60px;
      border-bottom-left-radius: 40px;
      border-bottom-right-radius: 40px;
      text-align: center;
    }
    .logo { width: 140px; margin-bottom: 20px; }
    .header h1 { color: white; font-size: 24px; margin-bottom: 8px; }
    .header p { color: white; opacity: 0.9; font-size: 14px; margin-bottom: 20px; }
    .login-btn {
      background: white;
      color: black;
      border: none;
      padding: 12px 50px; /* smaller */
      border-radius: 50px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .content { padding: 30px 24px; }
    .content h2 { font-size: 22px; margin-bottom: 20px; color: #222; }
    
    .input-group {
      background: #E0E0E0;
      border-radius: 12px;
      padding: 12px 14px; /* smaller padding */
      display: flex;
      align-items: center;
      margin-bottom: 14px;
    }
    .input-group svg { width: 18px; height: 18px; margin-right: 10px; fill: #666; flex-shrink: 0; }
    .input-group input {
      border: none;
      background: transparent;
      outline: none;
      font-size: 15px; /* smaller font */
      width: 100%;
      color: #333;
    }
    .input-group input::placeholder {
      color: #888;
      font-size: 15px;
    }

    .register-btn {
      width: 100%;
      background: #00C853;
      color: white;
      border: none;
      padding: 14px; /* smaller */
      border-radius: 50px;
      font-size: 16px;
      font-weight: 700;
      margin-top: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="assets/logo2.jpeg" alt="KayaRemit" class="logo">
      <h1>Welcome Back!</h1>
      <p>To use KayaRemit, please sign in to continue</p>
      <button class="login-btn" onclick="window.location.href='login.html'">Login</button>
    </div>

    <div class="content">
      <h2>Create Account</h2>
      <form>
        <div class="input-group">
          <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          <input type="text" placeholder="Name" required>
        </div>
        <div class="input-group">
          <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
          <input type="email" placeholder="Email" required>
        </div>
        <div class="input-group">
          <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6z"/></svg>
          <input type="password" placeholder="Password" required>
        </div>
        <button type="submit" class="register-btn">Register</button>
      </form>
    </div>
  </div>
</body>
</html>
